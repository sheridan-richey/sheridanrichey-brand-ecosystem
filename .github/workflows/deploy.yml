name: Deploy to Vercel

on:
  push:
    branches: [main, newsletter-integration, github-actions-deployment, feature/*]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: website

      - name: Deploy to Vercel
        id: deploy
        working-directory: website
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          PROD_FLAG=""
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            PROD_FLAG="--prod"
          fi
          DEPLOY_URL=$(npx vercel@latest deploy --token "$VERCEL_TOKEN" --yes $PROD_FLAG 2>&1 | tee /tmp/vercel-deploy.log | tail -n 1)
          echo "preview-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $DEPLOY_URL"

      - name: Show Deployment URL
        run: |
          echo "🚀 Deployment URL: ${{ steps.deploy.outputs.preview-url }}"
          echo "📝 Branch: ${{ github.ref_name }}"
          echo "🔗 Production: https://sheridanrichey.com"
